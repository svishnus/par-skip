name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  make:
    name: make test (${{ matrix.os }}, ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++ }
          - { os: ubuntu-latest, cxx: clang++ }
          - { os: macos-latest, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: build and run tests
        run: make -j4 CXX=${{ matrix.cxx }} test
      - name: build benchmarks and examples
        run: make -j4 CXX=${{ matrix.cxx }} bench examples && build/examples/custom_metric 20000
      - name: single-worker run
        run: PARLAY_NUM_THREADS=1 build/tests/test_build_par
