<svg xmlns='http://www.w3.org/2000/svg' width='760' height='254' viewBox='0 0 760 254' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>
<rect width='760' height='254' fill='#fcfcfb'/>
